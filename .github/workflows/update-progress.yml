name: Update progress from Smartsheet

on:
  schedule:
    # GitHub schedules run in UTC. These fire weekdays around 7:50 AM and 12:50 PM Central
    # (CDT, UTC-5) and an hour earlier in Central Standard Time (UTC-6).
    - cron: "50 12,17 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-progress
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read Smartsheet and write progress.json
        env:
          SMARTSHEET_TOKEN: ${{ secrets.SMARTSHEET_TOKEN }}
        run: python scripts/update_progress.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add progress.json
          git commit -m "Update progress from Smartsheet ($(python -c 'import json;print(json.load(open("progress.json"))["updatedLabel"])'))" || exit 0
          git pull --rebase origin main
          git push origin main
