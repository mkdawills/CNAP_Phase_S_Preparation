      pcNote: pcPct >= 100 ? 'All assignments finalized. Thank you, team!' : (pcPct >= 75 ? '75% milestone reached! Next milestone: 100% finalized by Friday, January 15.' : (pcPct >= 50 ? 'Halfway there! Next milestone: 75% finalized by Monday, January 11.' : (pcPct >= 25 ? '25% milestone reached! Next milestone: 50% finalized by Thursday, December 17.' : 'Next milestone: 25% finalized by Friday, December 4.'))),
      pcAria: k5 + ' of ' + tot + ' assignments finalized',
      w1: pw(k1), w2: pw(k2), w3: pw(k3), w4: pw(k4), w5: pw(k5),
      k1: String(k1), k2: String(k2), k3: String(k3), k4: String(k4), k5: String(k5),
      f1: fill[0], f2: fill[1], f3: fill[2], f4: fill[3], f5: fill[4], f6: fill[5],
      n1: node[0], n2: node[1], n3: node[2], n4: node[3], n5: node[4], n6: node[5],
      p1: showPin && pinCell === 0, p2: showPin && pinCell === 1, p3: showPin && pinCell === 2,
      p4: showPin && pinCell === 3, p5: showPin && pinCell === 4, p6: showPin && pinCell === 5,
      pinLeft: pinLeft,
      arcD: arcD, arcX: arcX, arcPinY1: (arcY - 30).toFixed(1), arcPinY2: (arcY + 22).toFixed(1), arcLabY: (arcY - 36).toFixed(1),
      arcPinCls: showPin ? '' : 'off', todayUp: (months[now.getMonth()] + ' ' + now.getDate()).toUpperCase(),
      endCls: now > nih ? 'done' : '',
      today: months[now.getMonth()] + ' ' + now.getDate(),
      days: String(days),
      hours: two(hours),
      minutes: two(minutes),
      seconds: two(seconds),
      daysLabel: days === 1 ? 'day' : 'days',
      nihDays: String(nihDays),
      nihLabel: nihDays === 1 ? 'day' : 'days',
      nowLabel: nowLabel,
      pct: String(pct),
      c1: c(0), c2: c(1), c3: c(2), c4: c(3), c5: c(4), c6: c(5)
    };
  }
}

(function(){
  const fill = (tpl, vals) => tpl
    .replace(/\{\{\s*([A-Za-z0-9_]+)\s*\}\}/g, (m, k) => (vals[k] === undefined || vals[k] === null) ? '' : String(vals[k]))
    .replace(/<sc-if value="([^"]*)"[^>]*>([\s\S]*?)<\/sc-if>/g, (m, v, inner) => (v === 'true' ? inner : ''));
  const morph = (a, b) => {
    if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName) { a.replaceWith(b.cloneNode(true)); return; }
    if (a.nodeType === 3) { if (a.data !== b.data) a.data = b.data; return; }
    if (a.nodeType !== 1) return;
    for (const at of Array.from(b.attributes)) { if (at.name !== 'open' && a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value); }
    for (const at of Array.from(a.attributes)) { if (at.name !== 'open' && !b.hasAttribute(at.name)) a.removeAttribute(at.name); }
    const ac = Array.from(a.childNodes), bc = Array.from(b.childNodes);
    if (ac.length !== bc.length) { a.replaceChildren(...bc.map((n) => n.cloneNode(true))); return; }
    for (let i = 0; i < ac.length; i++) morph(ac[i], bc[i]);
  };
  const start = () => {
    const tpl = document.getElementById('dc-tpl').innerHTML;
    const root = document.getElementById('dc-root');
    const c = new Component(); window.__dcComp = c;
    let first = true;
    window.__dcRender = () => {
      const html = fill(tpl, c.renderVals ? c.renderVals() : {});
      if (first) { root.innerHTML = html; first = false; return; }
      const tmp = document.createElement('div'); tmp.innerHTML = html;
      const ac = Array.from(root.childNodes), bc = Array.from(tmp.childNodes);
      if (ac.length !== bc.length) { root.innerHTML = html; return; }
      for (let i = 0; i < ac.length; i++) morph(ac[i], bc[i]);
    };
    window.__dcRender();
    if (c.componentDidMount) c.componentDidMount();
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
